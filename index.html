<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestra Historia 💘</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
padding:0;
background:radial-gradient(circle at top,#ff4e8d,#8b004f);
font-family:'Quicksand',sans-serif;
color:white;
text-align:center;
overflow-x:hidden;
}

.container{
padding-top:120px;
}

/* corazón inicial */
#seed{
font-size:90px;
cursor:pointer;
animation:heartbeat 1s infinite;
}

@keyframes heartbeat{
0%,100%{transform:scale(1);}
50%{transform:scale(1.2);}
}

/* árbol */
#tree{
display:none;
font-size:80px;
margin-top:-120px;
animation:grow 3s ease forwards;
position:relative;
}

@keyframes grow{
0%{transform:scale(0);}
100%{transform:scale(3);}
}

.tree-hearts{
position:absolute;
top:-40px;
left:50%;
transform:translateX(-50%);
font-size:28px;
}

/* texto */
#message{
margin-top:100px;
font-size:38px;
font-family:'Playfair Display',serif;
}

#timer{
margin-top:20px;
font-size:24px;
font-weight:600;
}

.subtext{
margin-top:25px;
font-size:18px;
max-width:800px;
margin-left:auto;
margin-right:auto;
padding:0 20px;
}

/* botones */
.buttons{
margin-top:60px;
display:none;
}

button{
padding:14px 28px;
font-size:20px;
border:none;
border-radius:14px;
margin:10px;
cursor:pointer;
}

#yesBtn{background:#00cc66;color:white;}
#noBtn{background:#ff3333;color:white;position:relative;}

/* galería */
.gallery{
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
padding:60px 10%;
}

.card{
background:rgba(255,255,255,0.1);
padding:20px;
border-radius:20px;
}

.card img{
width:100%;
border-radius:15px;
}

.card h2{
font-family:'Playfair Display',serif;
margin-bottom:15px;
}

.card p{
font-size:16px;
line-height:1.6;
}

@media(max-width:768px){
.gallery{
grid-template-columns:1fr;
padding:40px 5%;
}
#message{font-size:28px;}
}
</style>
</head>

<body>

<div class="container">

<div id="seed" onclick="startTree()">💖</div>

<div id="tree">
🌳
<div class="tree-hearts">💖 💙 💜 💛 💚</div>
</div>

<div id="message"></div>
<div id="timer"></div>

<div id="text1" class="subtext">
Este regalo es para ti Maguin, una persona que amo muchísimo, que respeto y sobre todo admiro... 🤍
</div>

<div id="text2" class="subtext">
Esta página web la diseñé especialmente para ti, es algo que no había intentado y espero te guste muchísimo, continúa abriendo tu regalito jejeje 😊❤️
</div>

<div class="buttons">
<h2>¿Quieres ser mi San Valentín? 💝</h2>
<button id="yesBtn">Sí 💖</button>
<button id="noBtn">No 😢</button>
</div>

</div>

<script>

const startDate=new Date("2023-08-23T00:00:00");
let yesSize=1;

function startTree(){
document.getElementById("seed").style.display="none";
document.getElementById("tree").style.display="block";
startExperience();
}

function startExperience(){
typeWriter("Mi amor por ti comenzó el 23 de agosto de 2023...");
updateTimer();
setInterval(updateTimer,1000);

setTimeout(()=>{
document.querySelector(".buttons").style.display="block";
document.getElementById("text2").style.display="none";
},5000);
}

function typeWriter(text){
let i=0;
let msg=document.getElementById("message");
function typing(){
if(i<text.length){
msg.innerHTML+=text.charAt(i);
i++;
setTimeout(typing,40);
}
}
typing();
}

function updateTimer(){
const now=new Date();
const diff=now-startDate;
const days=Math.floor(diff/1000/60/60/24);
const hours=Math.floor(diff/1000/60/60)%24;
const minutes=Math.floor(diff/1000/60)%60;
const seconds=Math.floor(diff/1000)%60;

document.getElementById("timer").innerHTML=
days+" días, "+hours+" horas, "+minutes+" minutos, "+seconds+" segundos contigo ❤️";
}

document.addEventListener("DOMContentLoaded",function(){
const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");

noBtn.addEventListener("mouseover",function(){
const x=Math.random()*(window.innerWidth-100);
const y=Math.random()*(window.innerHeight-50);
noBtn.style.position="fixed";
noBtn.style.left=x+"px";
noBtn.style.top=y+"px";
yesSize+=0.2;
yesBtn.style.transform="scale("+yesSize+")";
});

yesBtn.addEventListener("click",function(){
document.body.innerHTML=`

<h1 style="margin-top:80px;font-family:'Playfair Display',serif;font-size:50px;">
Jejeje espero te haya gustado muchísimo 💖
</h1>

<div class="gallery">

<div class="card">
<h2>Roblox 🎮❤️</h2>
<img src="1.jpeg">
<p>estos son algunas de tantas capturas que logre tomar mientras jugabamos roblox, que por cierto se que tendremos muchas mas! y sobre todo de terror, porque la verdad me encanta jugar mucho con vos aparte me llevo tremendos sustos JAJAJ, eres mas valiente que yo y siempre sigo tus instintos que siempre son acertados.</p>
</div>

<div class="card">
<h2>Roblox 🎮❤️</h2>
<img src="2.jpeg">
<p>esta imagen es la original sin editar, espero te guste 👧👦</p>
</div>

<div class="card">
<h2>Nosotros bailando en Parkour roblox</h2>
<img src="3.jpeg">
<p>esta actividad que elegiste me encanto mucho sobre todo porque nos estuvimos riendo bien duro JAJAJ y la pasamos super chevere con los bailes!, nos veiamos bien divas los 2, amo, y mucha risa porque casi siempre te jalaba de la cuerda cuando nos caiamos, PD: Hay que intentarlo de nuevo jejej.</p>
</div>

<div class="card">
<h2>Nosotros 💕</h2>
<img src="4.jpeg">
<p>esta foto ya no es sorpresa sin querer te arruine la sorpresa hace unos dias pero bueno, no me aguantaba en darte este regalo, quiero que sepas que te quiero muchisimo, lo sabes muy bien de mi parte, se que aveces soy terco, que no escucho aveces o que quizas me pongo muy irritable pero quiero que sepas que siempre siempre te tratare como una reina, como una persona que merece ser respetada, mi corazon es todo tuyo y espero pases un hermoso 14 de febrero 😘</p>
</div>

</div>
`;
});
});
</script>

</body>
</html>
