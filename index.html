<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestro Árbol 💖</title>

<style>

/* =========================
   VARIABLES GLOBALES
========================= */
:root{
  --bg-top: #f6e7d7;
  --bg-bottom: #e8b6b6;
  --trunk-color: #6b3e26;
  --leaf-color: #c9184a;
  --text-color: #4a2c2a;
  --grow-duration: 3s;
  --leaf-delay: 3.5s;
}

/* =========================
   LAYOUT
========================= */
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:linear-gradient(var(--bg-top), var(--bg-bottom));
  font-family:'Segoe UI',sans-serif;
  overflow:hidden;
  color:var(--text-color);
}

.container{
  text-align:center;
}

/* =========================
   SVG TREE
========================= */
svg{
  width:420px;
  max-width:90vw;
}

/* Crecimiento de ramas */
.branch{
  fill:none;
  stroke:var(--trunk-color);
  stroke-width:4;
  stroke-linecap:round;
  stroke-dasharray:1000;
  stroke-dashoffset:1000;
  animation:growBranch var(--grow-duration) ease forwards;
}

.branch.delay-1 { animation-delay:1s; }
.branch.delay-2 { animation-delay:2s; }

/* Corazones */
.leaf{
  fill:var(--leaf-color);
  opacity:0;
  transform:scale(0.5);
  animation:leafAppear 1s ease forwards;
}

.leaf.delay-3 { animation-delay: var(--leaf-delay); }
.leaf.delay-4 { animation-delay: calc(var(--leaf-delay) + 0.5s); }
.leaf.delay-5 { animation-delay: calc(var(--leaf-delay) + 1s); }
.leaf.delay-6 { animation-delay: calc(var(--leaf-delay) + 1.5s); }

/* =========================
   ANIMACIONES
========================= */
@keyframes growBranch{
  to{
    stroke-dashoffset:0;
  }
}

@keyframes leafAppear{
  0%{
    opacity:0;
    transform:scale(0.3);
  }
  60%{
    opacity:1;
    transform:scale(1.2);
  }
  100%{
    opacity:1;
    transform:scale(1);
  }
}

/* =========================
   CONTADOR
========================= */
.timer{
  margin-top:20px;
  font-size:18px;
  font-weight:500;
}

.timer span{
  font-weight:bold;
  display:block;
  margin-top:5px;
}

</style>
</head>

<body>

<div class="container">

<svg viewBox="0 0 400 500">

  <!-- Tronco -->
  <path class="branch" d="M200 500 L200 350" />

  <!-- Ramas principales -->
  <path class="branch delay-1" d="M200 380 Q150 300 120 250" />
  <path class="branch delay-1" d="M200 380 Q250 300 280 250" />

  <!-- Ramas secundarias -->
  <path class="branch delay-2" d="M200 350 Q160 280 150 220" />
  <path class="branch delay-2" d="M200 350 Q240 280 250 220" />

  <!-- Corazones -->
  <path class="leaf delay-3" d="M120 240 
  C110 220, 80 220, 80 250 
  C80 280, 120 300, 120 300 
  C120 300, 160 280, 160 250 
  C160 220,130 220,120 240 Z"/>

  <path class="leaf delay-4" d="M280 240 
  C270 220, 240 220, 240 250 
  C240 280, 280 300, 280 300 
  C280 300, 320 280, 320 250 
  C320 220,290 220,280 240 Z"/>

  <path class="leaf delay-5" d="M150 210 
  C140 190, 110 190, 110 220 
  C110 250, 150 270, 150 270 
  C150 270, 190 250, 190 220 
  C190 190,160 190,150 210 Z"/>

  <path class="leaf delay-6" d="M250 210 
  C240 190, 210 190, 210 220 
  C210 250, 250 270, 250 270 
  C250 270, 290 250, 290 220 
  C290 190,260 190,250 210 Z"/>

</svg>

<div class="timer">
  Mi amor por ti comenzó hace...
  <span id="time"></span>
</div>

</div>

<script>

/* =========================
   CONFIGURA TU FECHA AQUÍ
========================= */
const startDate = new Date("2025-01-01T00:00:00");

function updateTimer(){
  const now = new Date();
  const diff = now - startDate;

  const seconds = Math.floor(diff/1000)%60;
  const minutes = Math.floor(diff/1000/60)%60;
  const hours = Math.floor(diff/1000/60/60)%24;
  const days = Math.floor(diff/1000/60/60/24);

  document.getElementById("time").innerHTML =
    `${days} días ${hours} horas ${minutes} minutos ${seconds} segundos ❤️`;
}

setInterval(updateTimer,1000);
updateTimer();

</script>

</body>
</html>
