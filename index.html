
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestra Historia 💘</title>

<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff4e8d, #ff9ecf);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
    color: white;
    text-align: center;
}

#tree {
    font-size: 80px;
    animation: grow 3s ease forwards;
}

@keyframes grow {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
}

.leaf {
    position: absolute;
    font-size: 30px;
    animation: float 4s infinite ease-in-out;
}

@keyframes float {
    0% { transform: translateY(0); opacity:1; }
    50% { transform: translateY(-50px); opacity:0.8; }
    100% { transform: translateY(0); opacity:1; }
}

#timer {
    margin-top: 30px;
    font-size: 22px;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="tree">💗</div>

<div id="timer">
Mi amor comenzó por ti hace...
<br>
<span id="time"></span>
</div>

<script>

// 🔥 CAMBIA ESTA FECHA
const startDate = new Date("2025-06-14T22:30:00");

function updateTimer() {
    const now = new Date();
    const diff = now - startDate;

    const seconds = Math.floor(diff / 1000) % 60;
    const minutes = Math.floor(diff / 1000 / 60) % 60;
    const hours = Math.floor(diff / 1000 / 60 / 60) % 24;
    const days = Math.floor(diff / 1000 / 60 / 60 / 24);

    document.getElementById("time").innerHTML =
        days + " días, " +
        hours + " horas, " +
        minutes + " minutos, " +
        seconds + " segundos ❤️";
}

setInterval(updateTimer, 1000);
updateTimer();


// 🌳 Crear corazones hojas
function createLeaf() {
    const leaf = document.createElement("div");
    leaf.classList.add("leaf");
    leaf.innerHTML = "❤️";

    leaf.style.left = Math.random() * window.innerWidth + "px";
    leaf.style.top = Math.random() * window.innerHeight + "px";

    document.body.appendChild(leaf);

    setTimeout(() => {
        leaf.remove();
    }, 4000);
}

setInterval(createLeaf, 500);

</script>

</body>
</html>
