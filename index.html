<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestra Historia 💘</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #ff4e8d, #8b004f);
    overflow: hidden;
    font-family: 'Quicksand', sans-serif;
    color: white;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

/* Corazón inicial */
#seed {
    font-size: 90px;
    animation: heartbeat 1s infinite;
    cursor: pointer;
}

@keyframes heartbeat {
    0%,100% { transform: scale(1); }
    25%,75% { transform: scale(1.2); }
    50% { transform: scale(1); }
}

/* Árbol */
#tree {
    display: none;
    font-size: 80px;
    margin-top: -150px; /* más arriba */
    animation: grow 4s ease forwards;
    position: relative;
}

@keyframes grow {
    0% { transform: scale(0); }
    50% { transform: scale(2); }
    100% { transform: scale(3); }
}

/* Corazones centrados al árbol */
.tree-hearts {
    position: absolute;
    top: -30px;
    left: 45%; /* más a la izquierda */
    transform: translateX(-50%);
    font-size: 28px;
    animation: pulse 2s infinite;
    text-align: center;
    width: 100%;
}

@keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.2); }
}

.leaf {
    position: absolute;
    font-size: 24px;
    animation: float 6s linear infinite;
    opacity: 0.8;
}

@keyframes float {
    0% { transform: translateY(100vh) rotate(0deg); }
    100% { transform: translateY(-10vh) rotate(360deg); }
}

/* Texto principal más abajo */
#message {
    margin-top: 80px; /* bajado */
    font-size: 38px;
    font-family: 'Playfair Display', serif;
    min-height: 60px;
}

/* Timer */
#timer {
    margin-top: 20px;
    font-size: 24px;
    font-weight: 700;
}

/* Subtexto */
.subtext {
    font-size: 18px;
    margin-top: 12px;
    opacity: 0.95;
    max-width: 700px;
    padding: 0 20px;
}

/* Botones */
.buttons {
    margin-top: 40px;
    display: none;
    text-align: center;
    position: relative;
}

button {
    padding: 14px 30px;
    font-size: 20px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    margin: 12px;
    transition: 0.3s;
    font-family: 'Quicksand', sans-serif;
}

#yesBtn {
    background: #00cc66;
    color: white;
}

#noBtn {
    background: #ff3333;
    color: white;
    position: relative;
}
</style>
</head>

<body>

<div id="seed" onclick="startTree()">💖</div>

<div id="tree">
    🌳
    <div class="tree-hearts">💖 💙 💜 💛 💚</div>
</div>

<div id="message"></div>
<div id="timer"></div>

<div class="subtext">
    Este regalo es para ti Maguin, una persona que amo muchísimo, que respeto y sobre todo admiro... 🤍
</div>

<div class="subtext">
    Esta página web la diseñé especialmente para ti, es algo que no había intentado y espero te guste muchísimo, continúa abriendo tu regalito jejeje 😊❤️
</div>

<div class="buttons">
    <h2>¿Quieres ser mi San Valentín? 💝</h2>
    <button id="yesBtn">Sí 💖</button>
    <button id="noBtn">No 😢</button>
</div>

<script>

const startDate = new Date("2023-08-23T00:00:00");
let yesSize = 1;

function startTree() {
    document.getElementById("seed").style.display = "none";
    document.getElementById("tree").style.display = "block";
    startExperience();
}

function startExperience() {
    typeWriter("Mi amor por ti comenzó el 23 de agosto de 2023...");
    startLeaves();
    updateTimer();
    setInterval(updateTimer, 1000);

    setTimeout(() => {
        document.querySelector(".buttons").style.display = "block";
    }, 4000);
}

function typeWriter(text) {
    let i = 0;
    const message = document.getElementById("message");
    message.innerHTML = "";
    function typing() {
        if (i < text.length) {
            message.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, 40);
        }
    }
    typing();
}

function updateTimer() {
    const now = new Date();
    const diff = now - startDate;

    const seconds = Math.floor(diff / 1000) % 60;
    const minutes = Math.floor(diff / 1000 / 60) % 60;
    const hours = Math.floor(diff / 1000 / 60 / 60) % 24;
    const days = Math.floor(diff / 1000 / 60 / 60 / 24);

    document.getElementById("timer").innerHTML =
        days + " días, " +
        hours + " horas, " +
        minutes + " minutos, " +
        seconds + " segundos contigo ❤️";
}

function startLeaves() {
    const colors = ["❤️","💖","💗","💓","💞","💘","💝"];
    setInterval(() => {
        const leaf = document.createElement("div");
        leaf.classList.add("leaf");
        leaf.innerHTML = colors[Math.floor(Math.random() * colors.length)];
        leaf.style.left = Math.random() * window.innerWidth + "px";
        leaf.style.animationDuration = (Math.random() * 3 + 3) + "s";
        document.body.appendChild(leaf);

        setTimeout(() => {
            leaf.remove();
        }, 6000);
    }, 300);
}

document.addEventListener("DOMContentLoaded", function() {
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");

    noBtn.addEventListener("mouseover", function() {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);

        noBtn.style.position = "fixed";
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";

        yesSize += 0.25;
        yesBtn.style.transform = "scale(" + yesSize + ")";
    });

    yesBtn.addEventListener("click", function() {
        document.body.innerHTML = `
            <h1 style="font-family:'Playfair Display',serif;font-size:60px;">
                Jejeje espero te haya gustado muchísimo 💖
            </h1>
            <h2 style="font-size:32px;">Te amo infinito ❤️✨</h2>
        `;
    });
});

</script>

</body>
</html>
