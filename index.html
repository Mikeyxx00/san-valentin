<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestro Árbol ❤️</title>

<style>
:root{
  --bg:#e7cbb5;
  --trunk:#3b1407;
  --heart1:#ff4d6d;
  --heart2:#d00000;
  --heart3:#ff758f;
}

body{
  margin:0;
  height:100vh;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:sans-serif;
}

svg{
  width:700px;
  max-width:95vw;
}

/* Crecimiento ramas */
.branch{
  fill:none;
  stroke:var(--trunk);
  stroke-width:5;
  stroke-linecap:round;
  stroke-dasharray:2000;
  stroke-dashoffset:2000;
  animation:grow 4s ease forwards;
}

.branch.delay1{animation-delay:1s;}
.branch.delay2{animation-delay:2s;}
.branch.delay3{animation-delay:3s;}

@keyframes grow{
  to{stroke-dashoffset:0;}
}

/* Corazones */
.leaf{
  opacity:0;
  transform:scale(0);
  animation:pop 0.6s ease forwards;
}

@keyframes pop{
  0%{opacity:0;transform:scale(0);}
  60%{opacity:1;transform:scale(1.2);}
  100%{opacity:1;transform:scale(1);}
}
</style>
</head>

<body>

<svg viewBox="0 0 800 700">

  <!-- Tronco -->
  <path class="branch" d="M400 650 L400 450"/>

  <!-- Ramas principales -->
  <path class="branch delay1" d="M400 500 Q250 350 150 250"/>
  <path class="branch delay1" d="M400 500 Q550 350 650 250"/>

  <!-- Ramas secundarias -->
  <path class="branch delay2" d="M300 400 Q200 300 120 200"/>
  <path class="branch delay2" d="M500 400 Q600 300 680 200"/>

  <!-- Ramas superiores -->
  <path class="branch delay3" d="M400 450 Q350 300 300 200"/>
  <path class="branch delay3" d="M400 450 Q450 300 500 200"/>

  <!-- Grupo hojas -->
  <g id="leaves"></g>

</svg>

<script>

const leavesGroup = document.getElementById("leaves");

// Función crear corazón SVG
function createHeart(x,y,size,color,delay){
  const heart = document.createElementNS("http://www.w3.org/2000/svg","path");
  heart.setAttribute("d",`
    M ${x} ${y}
    C ${x-size} ${y-size},
      ${x-2*size} ${y-size},
      ${x-2*size} ${y}
    C ${x-2*size} ${y+size},
      ${x} ${y+2*size},
      ${x} ${y+2*size}
    C ${x} ${y+2*size},
      ${x+2*size} ${y+size},
      ${x+2*size} ${y}
    C ${x+2*size} ${y-size},
      ${x+size} ${y-size},
      ${x} ${y} Z
  `);
  heart.setAttribute("fill",color);
  heart.classList.add("leaf");
  heart.style.animationDelay = delay+"s";
  leavesGroup.appendChild(heart);
}

// Generar copa en forma de corazón
const totalHearts = 120;

for(let i=0;i<totalHearts;i++){

  let angle = Math.random()*Math.PI;
  let radius = 200 + Math.random()*100;

  let x = 400 + Math.cos(angle)*radius;
  let y = 250 - Math.sin(angle)*radius*0.8;

  // Dar forma general de corazón grande
  if(y < 120) y += 60;

  const colors = ["#ff4d6d","#d00000","#ff758f"];
  const randomColor = colors[Math.floor(Math.random()*colors.length)];

  createHeart(x,y,6+Math.random()*4,randomColor,4+i*0.03);
}

</script>

</body>
</html>
