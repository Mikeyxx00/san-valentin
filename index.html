<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestra Historia 💘</title>

<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #ff4e8d, #b30059);
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

/* Corazón inicial */
#seed {
    font-size: 80px;
    animation: heartbeat 1s infinite;
    cursor: pointer;
}

@keyframes heartbeat {
    0% { transform: scale(1); }
    25% { transform: scale(1.2); }
    50% { transform: scale(1); }
    75% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

/* Árbol */
#tree {
    display: none;
    font-size: 60px;
    animation: grow 4s ease forwards;
}

@keyframes grow {
    0% { transform: scale(0); }
    50% { transform: scale(1.5); }
    100% { transform: scale(2.5); }
}

.leaf {
    position: absolute;
    font-size: 24px;
    animation: float 6s linear infinite;
    opacity: 0.8;
}

@keyframes float {
    0% { transform: translateY(100vh) rotate(0deg); }
    100% { transform: translateY(-10vh) rotate(360deg); }
}

#message {
    margin-top: 20px;
    font-size: 26px;
    min-height: 40px;
}

#timer {
    margin-top: 15px;
    font-size: 20px;
    font-weight: bold;
}

.buttons {
    margin-top: 30px;
    display: none;
}

button {
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
}

#yesBtn {
    background: #00cc66;
    color: white;
}

#noBtn {
    background: #ff3333;
    color: white;
    position: absolute;
}
</style>
</head>

<body>

<div id="seed" onclick="startTree()">💖</div>
<div id="tree">🌳</div>

<div id="message"></div>
<div id="timer"></div>

<div class="buttons">
    <h2>¿Quieres ser mi San Valentín? 💝</h2>
    <button id="yesBtn">Sí 💖</button>
    <button id="noBtn">No 😢</button>
</div>

<script>

const startDate = new Date("2025-01-01T00:00:00");

let yesSize = 1;

function startTree() {
    document.getElementById("seed").style.display = "none";
    document.getElementById("tree").style.display = "block";
    startExperience();
}

function startExperience() {
    typeWriter("Mi amor comenzó por ti hace...");
    startLeaves();
    updateTimer();
    setInterval(updateTimer, 1000);

    setTimeout(() => {
        document.querySelector(".buttons").style.display = "block";
    }, 4000);
}

function typeWriter(text) {
    let i = 0;
    const message = document.getElementById("message");
    message.innerHTML = "";
    function typing() {
        if (i < text.length) {
            message.innerHTML += text.charAt(i);
            i++;
            setTimeout(typing, 50);
        }
    }
    typing();
}

function updateTimer() {
    const now = new Date();
    const diff = now - startDate;

    const seconds = Math.floor(diff / 1000) % 60;
    const minutes = Math.floor(diff / 1000 / 60) % 60;
    const hours = Math.floor(diff / 1000 / 60 / 60) % 24;
    const days = Math.floor(diff / 1000 / 60 / 60 / 24);

    document.getElementById("timer").innerHTML =
        days + " días, " +
        hours + " horas, " +
        minutes + " minutos, " +
        seconds + " segundos ❤️";
}

function startLeaves() {
    setInterval(() => {
        const leaf = document.createElement("div");
        leaf.classList.add("leaf");
        leaf.innerHTML = "❤️";
        leaf.style.left = Math.random() * window.innerWidth + "px";
        leaf.style.animationDuration = (Math.random() * 3 + 3) + "s";
        document.body.appendChild(leaf);

        setTimeout(() => {
            leaf.remove();
        }, 6000);
    }, 300);
}

/* Botón NO huye */
document.addEventListener("DOMContentLoaded", function() {
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");

    noBtn.addEventListener("mouseover", function() {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";

        yesSize += 0.2;
        yesBtn.style.transform = "scale(" + yesSize + ")";
    });

    yesBtn.addEventListener("click", function() {
        document.body.innerHTML = `
            <h1 style="font-size:50px;">Sabía que dirías que sí 😍💖</h1>
            <h2>Te amo infinito ❤️✨</h2>
        `;
    });
});

</script>

</body>
</html>
